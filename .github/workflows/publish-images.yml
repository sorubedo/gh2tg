name: Publish container images

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - Dockerfile
      - docker/**
      - .github/workflows/publish-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Could not read the package version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate one-shot image metadata
        id: metadata-one-shot
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push one-shot image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: one-shot
          push: true
          tags: ${{ steps.metadata-one-shot.outputs.tags }}
          labels: ${{ steps.metadata-one-shot.outputs.labels }}

      - name: Generate cron image metadata
        id: metadata-cron
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-cron
            type=raw,value=cron

      - name: Build and push cron image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cron
          push: true
          tags: ${{ steps.metadata-cron.outputs.tags }}
          labels: ${{ steps.metadata-cron.outputs.labels }}
