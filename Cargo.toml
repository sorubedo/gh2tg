[package]
name = "gh2tg"
version = "0.2.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
indicatif = "0.18"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
teloxide = { version = "0.17.0", default-features = false, features = ["native-tls"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
url = "2"
